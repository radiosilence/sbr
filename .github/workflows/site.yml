name: Site

# Builds the sbr.blit.cc image and, on main, publishes it and asks the jaritanet deployment to pick it up. Which version
# is deployed, and how the pin moves, belong to jaritanet's updater; this only says a build exists.

permissions:
  contents: read
  packages: write

on:
  # Every push to main, not only site changes: the deployment follows the image tagged with main's head, so every head
  # needs one. The build is a copy of a few files.
  push:
    branches: [main]
  pull_request:
    paths:
      - "site/**"
      - ".github/workflows/site.yml"

env:
  IMAGE: ghcr.io/radiosilence/sbr-site

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The charts are generated into the committed page; a page that differs from what the data renders is stale.
      - name: Charts match the data
        run: |
          python3 -I site/src/charts.py
          git diff --exit-code site/public

      # The server marks every file immutable for a year, so a stylesheet at a fixed URL is never fetched again once a
      # browser has it. Its URL carries a hash of its content instead.
      - name: Stamp the stylesheet URL
        working-directory: site
        run: |
          v=$(sha256sum public/style.css | cut -c1-12)
          find public -name '*.html' -exec sed -i "s|href=\"/style.css\"|href=\"/style.css?v=$v\"|" {} +
          grep -q "style.css?v=$v" public/index.html public/privacy/index.html

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Both architectures from one build: nothing in the image is architecture-specific.
      - name: Build and push
        env:
          PUSH: ${{ github.ref == 'refs/heads/main' }}
        run: |
          TAG="sha-$(echo "$GITHUB_SHA" | cut -c1-7)"
          if [ "$PUSH" = true ]; then
            docker buildx build site --platform linux/amd64,linux/arm64 \
              --tag "$IMAGE:$TAG" --tag "$IMAGE:latest" \
              --label org.opencontainers.image.revision="$GITHUB_SHA" --push
          else
            docker buildx build site --load --tag "$IMAGE:$TAG"
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    concurrency:
      group: site-deploy
      cancel-in-progress: true
    steps:
      # DEPLOYMENT_PAT needs `actions: write` on radiosilence/jaritanet; it triggers the updater, it doesn't commit.
      - name: Ask the deployment to pick this up
        env:
          GH_TOKEN: ${{ secrets.DEPLOYMENT_PAT }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::DEPLOYMENT_PAT isn't set, so the deployment wasn't asked to update"
            exit 0
          fi
          gh workflow run update-apps.yml --repo radiosilence/jaritanet
