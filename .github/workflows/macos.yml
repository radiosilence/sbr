name: macOS

# Archives the Developer ID macOS app, signs it, packages it as a disk image
# (apple/macos-release.sh) and uploads that as the `sbr-macos` artifact.
#
# Called by CI/CD: on a release pull request without notarising, so signing
# and export are proven before the merge, and on the release push with it,
# for the GitHub release. Runnable by hand to try the signing, in which case
# it builds the macOS slice of the xcframework itself.
on:
  workflow_call:
    inputs:
      notarise:
        type: boolean
        required: true
  workflow_dispatch:
    inputs:
      notarise:
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dmg:
    name: Disk image
    runs-on: macos-latest
    # Two notarisations, each waiting up to notarise.sh's 170 minutes. A run
    # that times out is re-run, and the re-run takes up the same submissions.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Present when called from CI/CD, so the release ships the core CI
      # checked; a manual run has none and builds it.
      - id: xcframework
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: SbrCore.xcframework
          path: ${{ runner.temp }}
      - if: steps.xcframework.outcome == 'success'
        run: tar xzf "$RUNNER_TEMP/SbrCore.xcframework.tar.gz" -C apple
      - if: steps.xcframework.outcome != 'success'
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
      - if: steps.xcframework.outcome != 'success'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: apple
          save-if: false
      - if: steps.xcframework.outcome != 'success'
        run: apple/build-xcframework.sh
        env:
          SBR_SKIP_TVOS: "1"
          SBR_SKIP_CATALYST: "1"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: xcodegen
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Developer ID
        uses: ./.github/actions/developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Stage the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::set the APPLE_API_* secrets"; exit 1; }
          key="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$key"
          echo "APPLE_API_KEY_PATH=$key" >> "$GITHUB_ENV"
      - name: Install the provisioning profiles
        run: uv run apple/tools/fetch-profiles.py "sbr mac Developer ID" "sbr mac tunnel Developer ID"
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - run: apple/macos-release.sh ${{ inputs.notarise && '--notarise' || '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbr-macos
          path: apple/build/macos/sbr-*.dmg
          if-no-files-found: error
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
