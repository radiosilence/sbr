name: CI/CD

# CI checks the change and ends in `Checks`, the one status a ruleset needs to
# require: a skipped job passes it, a failed or cancelled one fails it.
#
# CD runs after `Checks` has passed on main: every push uploads the iOS app to
# TestFlight, built from the xcframework the `Apple` job built and checked. A
# push that changes the workspace version to one not yet released (a merged
# `just release` pull request) also releases: the Developer ID macOS disk
# image and the GitHub release, whose tag CI creates. The Mac app's release
# build is the longest job and publishes nothing, so it starts alongside the
# checks rather than after them; the release waits for both. Apple's notary
# comes last, after the release is out, so its queue holds up nothing.
on:
  push:
    branches: [main]
    # Documentation alone runs nothing, but changelog fragments are linted.
    paths: ["**", "!**.md", "changelog.d/**"]
  pull_request:
    branches: [main]
    # Documentation alone runs nothing, but changelog fragments are linted.
    paths: ["**", "!**.md", "changelog.d/**"]
  # Releases the workspace version if it is not out yet: how a failed release
  # is retried.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

# The macOS runners are few, so a run nobody will look at gives way to the
# next. A pull request's newer push cancels its older run; on main, a newer
# push cancels an older one that releases nothing, since the newer one uploads
# to TestFlight in its place.
#
# A run that may release is in a group of its own and is never cancelled, and
# nor is a manual run. The group is chosen before any job runs, so it cannot
# ask `changes`: a push may release when its head commit is titled `release: `
# (as scripts/release.sh names its pull request) or changes Cargo.toml, which
# also keeps an ordinary dependency change from being cancelled.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' || (github.event_name == 'push' && !startsWith(github.event.head_commit.message, 'release: ') && !contains(github.event.head_commit.modified, 'Cargo.toml')) }}"

permissions:
  contents: read

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  # Whether this run releases, the one answer every release job reads: a push
  # to main that changes the workspace version, or a manual run on main, when
  # that version has no GitHub release yet. Answered first, so the release
  # build can start alongside the checks, and a release that would fail late
  # fails before any macOS runner starts.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          version=$(version_of < Cargo.toml)
          release=false
          if [ "$GITHUB_REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] \
            || { [ "$EVENT" = push ] && [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; }; }; then
            # Only a 404 means the version is not out. Any other failure stops
            # the run: guessing either way releases twice or never.
            if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              if printf '%s' "$out" | grep -q 'HTTP 404'; then
                release=true
              else
                echo "::error::cannot tell whether v$version is released: $out"
                exit 1
              fi
            fi
          fi
          if [ "$release" = true ]; then
            marketing=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apple/App/project.yml | head -1)
            if [ "$marketing" != "$version" ]; then
              echo "::error::apple/App/project.yml's MARKETING_VERSION ($marketing) differs from Cargo.toml's version ($version)"
              exit 1
            fi
            if ! grep -qxF "## $version" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version: release with just release"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "v$version: release=$release"

  # GitHub has no priority among its runners, and the account's few macOS ones
  # are what a release waits on. A release cancels this repository's pull
  # request runs, which are re-run from their page or by the next push, and
  # main's earlier runs that release nothing, which a newer one supersedes. A
  # job of its own, so only it holds a token that can cancel runs.
  make-room:
    name: Make room for the release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: changes
    if: needs.changes.outputs.release == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          SELF: ${{ github.run_id }}
        # Best effort: a run it cannot list or cancel only waits longer for a
        # runner. A push that changes Cargo.toml may release, as the
        # concurrency rule above has it, so it is left alone whatever its title.
        run: |
          for status in requested queued pending waiting in_progress; do
            gh run list --repo "$GITHUB_REPOSITORY" --workflow ci-cd.yml --status "$status" --limit 100 \
              --json databaseId,event,headBranch,headSha,displayTitle \
              --jq '.[] | select(.event == "pull_request" or (.event == "push" and .headBranch == "main" and (.displayTitle | startswith("release: ") | not))) | "\(.databaseId) \(.event) \(.headSha)"' || true
          done | sort -u | while read -r id event sha; do
            [ "$id" = "$SELF" ] && continue
            if [ "$event" = push ]; then
              files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/commits/$sha" --jq '.files[].filename' || echo Cargo.toml)
              printf '%s\n' "$files" | grep -qx Cargo.toml && continue
            fi
            echo "cancelling run $id"
            gh run cancel "$id" --repo "$GITHUB_REPOSITORY" || true
          done

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust cache: formatting compiles nothing.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy and the tests on one runner, sharing one target directory and one
  # cache. Each check runs however an earlier one went, so one push reports
  # every failure. The interop tests skip here: their reference servers are
  # installed on macOS only.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux
          # A failing check would otherwise leave the cache unsaved.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast

  # The same on macOS, where the code behind `target_vendor = "apple"` compiles,
  # and with sing-box, Xray and apernet hysteria2 installed so the interop
  # tests run against them rather than skipping.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: macos
          cache-on-failure: true
      - name: Install the interop servers
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        # Homebrew is updated first: the runner image's formulae lag by months,
        # and the tests follow current servers (the Xray those formulae held
        # failed the XHTTP and REALITY tests). Each test suite reads its own
        # variable; Homebrew's sing-box carries every build tag they need
        # (with_quic, with_utls).
        run: |
          brew update --quiet
          brew install sing-box xray hysteria
          bin=$(brew --prefix)/bin
          {
            echo "SBR_SING_BOX=$bin/sing-box"
            echo "SING_BOX=$bin/sing-box"
            echo "SING_BOX_BIN=$bin/sing-box"
            echo "SBR_SINGBOX_BIN=$bin/sing-box"
            echo "SBR_SINGBOX_UTLS_BIN=$bin/sing-box"
            echo "SBR_XRAY=$bin/xray"
            echo "SBR_HYSTERIA=$bin/hysteria"
          } >> "$GITHUB_ENV"
          "$bin/sing-box" version | head -1
          "$bin/xray" version | head -1
          "$bin/hysteria" version | grep -i '^version' || true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast

  # The xcframework for every Apple platform the app ships on, then the app
  # against it, unsigned. Main keeps the xcframework for TestFlight, so CD
  # ships what CI built.
  apple:
    name: Apple
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # The app has no Catalyst target; the slices build for nothing.
      SBR_SKIP_CATALYST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tvOS is tier 3: nightly builds its std from source. Stable last, so it
      # is the default toolchain the script's other builds use.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      # Seven release builds with fat LTO: the slowest part of the run.
      # Saved even when the app fails to build, since the Rust built fine.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
          cache-on-failure: true
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: xcodegen
      - run: apple/build-xcframework.sh
      - run: mise exec -- xcodegen generate
        working-directory: apple/App
      - name: Build the app
        working-directory: apple/App
        run: |
          for spec in Sbr:iOS Sbr:tvOS Sbr:macOS SbrMac:macOS; do
            scheme=${spec%%:*} platform=${spec##*:}
            echo "::group::$scheme ($platform)"
            log="$RUNNER_TEMP/build-$scheme-$platform.log"
            if xcodebuild build -project Sbr.xcodeproj -scheme "$scheme" \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
              tail -n 3 "$log"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              grep -E 'error:' "$log" || tail -n 60 "$log"
              echo "::error::$scheme failed to build for $platform"
              exit 1
            fi
          done
      # Tarred: an artifact keeps neither symlinks nor modes.
      - if: github.event_name != 'pull_request'
        run: tar czf "$RUNNER_TEMP/SbrCore.xcframework.tar.gz" -C apple SbrCore.xcframework
      - if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SbrCore.xcframework
          path: ${{ runner.temp }}/SbrCore.xcframework.tar.gz
          retention-days: 1

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; a release pull request, the one that
  # writes CHANGELOG.md, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release-v* ]]; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # Always runs: the workflows are checked wherever the change is, and the
  # image bundles shellcheck for the `run:` scripts.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The one status a ruleset needs to require.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, actionlint, fmt, linux, macos, apple, changelog]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────

  # Every push to main that passes uploads an iOS build: the version stays and
  # the build number (the time) rises, so testers always have main. A failed
  # upload is retried alone from ios.yml's manual dispatch.
  testflight:
    name: TestFlight
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit


  # The Developer ID macOS app, signed and packaged as a disk image, and
  # notarised by `notarise` once the release is out. Started by `make-room`
  # rather than after `Checks`: it is the longest job in a release and
  # publishes nothing, so it builds while the checks run, and the publishing
  # waits for both. It builds the macOS slice of the xcframework itself, from
  # the `Apple` job's cache.
  macos-release:
    name: Release (macOS)
    runs-on: macos-latest
    timeout-minutes: 120
    needs: [changes, make-room]
    if: ${{ !cancelled() && needs.make-room.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          shared-key: apple
          save-if: false
      - run: apple/build-xcframework.sh
        env:
          SBR_SKIP_IOS: "1"
          SBR_SKIP_TVOS: "1"
          SBR_SKIP_CATALYST: "1"
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: xcodegen
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - uses: ./.github/actions/developer-id
        with:
          certificate-p12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      - name: Install the provisioning profiles
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::set the APPLE_API_* secrets"; exit 1; }
          export APPLE_API_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$APPLE_API_KEY_PATH"
          uv run apple/tools/fetch-profiles.py "sbr mac Developer ID" "sbr mac tunnel Developer ID"
      - run: apple/macos-release.sh build
      - run: apple/macos-release.sh package
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbr-macos
          path: apple/build/macos/sbr-*.dmg
          if-no-files-found: error
          retention-days: 7
      - if: always()
        run: |
          rm -f "$RUNNER_TEMP/AuthKey.p8"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, checks, macos-release]
    if: ${{ !cancelled() && needs.changes.outputs.release == 'true' && needs.checks.result == 'success' && needs.macos-release.result == 'success' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbr-macos
          path: artifacts
      # Release writes go through RELEASE_TOKEN: GitHub refuses the workflow
      # token's tag creation for a commit that changes a workflow ("refusing to
      # allow a GitHub App to create or update workflow"), contents: write
      # notwithstanding, and sbr's workflow token is read-only.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      - name: Write the release notes
        run: |
          section=$(awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          Open sbr-$VERSION.dmg and drag sbr to Applications. On first connect,
          allow its network extension under System Settings › General › Login
          Items & Extensions. macOS 15 or later.
          $section
          NOTES
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # The action creates the tag through the API, on the commit that was
        # built. A re-run finds the release and tag and fills in what is
        # missing, such as an asset whose upload failed.
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.changes.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.changes.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          draft: false
          files: artifacts/sbr-${{ needs.changes.outputs.version }}.dmg
          fail_on_unmatched_files: true

  # Apple's notary, apart from the release: everything else is out by the time
  # this starts, and its queue can take hours. It notarises and staples the
  # disk image, whose ticket covers the app inside, and replaces the release's
  # copy with it. Failing or timing out fails this job alone; re-running it
  # waits on the submission already made (apple/tools/notarise.sh) rather than
  # submitting again.
  notarise:
    name: Notarise (macOS)
    runs-on: macos-latest
    timeout-minutes: 190
    needs: [changes, publish-release]
    if: ${{ !cancelled() && needs.publish-release.result == 'success' }}
    env:
      VERSION: ${{ needs.changes.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbr-macos
          path: apple/build/macos
      - name: Stage the App Store Connect key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          test -n "$APPLE_API_KEY_P8" || { echo "::error::set the APPLE_API_* secrets"; exit 1; }
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
      - run: apple/macos-release.sh notarise-dmg
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      - name: Replace the release's disk image
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: gh release upload "v$VERSION" "apple/build/macos/sbr-$VERSION.dmg" --clobber
      - if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
