name: CI/CD

# CI checks the change and ends in `Checks`, the one status a ruleset needs to
# require: a skipped job passes it, a failed or cancelled one fails it.
#
# CD runs after `Checks` has passed on main: every push uploads the iOS app to
# TestFlight, built from the xcframework the `Apple` job built and checked. A
# push that changes the workspace version to one not yet released (a merged
# `mise run release` pull request) also releases: the notarised macOS disk
# image and the GitHub release, whose tag CI creates.
on:
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:
    inputs:
      release:
        description: Release the workspace version if it is not out yet (how a failed release is retried)
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

# A pull request's newer push cancels its older run. Main is pushed to more
# often than a full run takes, so cancelling there would leave main never
# tested and the caches never saved: a newer push waits for the run in
# progress instead, and replaces any run still waiting, so the newest commit
# is the one tested next. A manual run is never cancelled.
#
# A push that may release is in a group of its own, so a later push cannot
# replace it while it waits. The group is chosen before any job runs, so it
# cannot ask `version`: a push may release when its head commit is titled
# `release: ` (as scripts/release.sh names its pull request) or changes
# Cargo.toml, which also keeps an ordinary dependency change in a group of its
# own.
concurrency:
  group: "ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.event_name == 'workflow_dispatch' && format('dispatch-{0}', github.run_id) || (startsWith(github.event.head_commit.message, 'release: ') || contains(github.event.head_commit.modified, 'Cargo.toml')) && format('release-{0}', github.sha) || 'main' }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # ── CI ──────────────────────────────────────────────────────────────────

  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # No Rust cache: formatting compiles nothing.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --all -- --check

  # Clippy and the tests on one runner, sharing one target directory and one
  # cache. Each check runs however an earlier one went, so one push reports
  # every failure. The interop tests skip here: their reference servers are
  # installed on macOS only.
  linux:
    name: Linux
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: linux
          # A failing check would otherwise leave the cache unsaved.
          cache-on-failure: true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast

  # The same on macOS, where the code behind `target_vendor = "apple"` compiles,
  # and with sing-box, Xray and apernet hysteria2 installed so the interop
  # tests run against them rather than skipping.
  macos:
    name: macOS
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          components: clippy
      - id: cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: macos
          cache-on-failure: true
      - name: Install the interop servers
        env:
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        # Homebrew is updated first: the runner image's formulae lag by months,
        # and the tests follow current servers (the Xray those formulae held
        # failed the XHTTP and REALITY tests). Each test suite reads its own
        # variable; Homebrew's sing-box carries every build tag they need
        # (with_quic, with_utls).
        run: |
          brew update --quiet
          brew install sing-box xray hysteria
          bin=$(brew --prefix)/bin
          {
            echo "SBR_SING_BOX=$bin/sing-box"
            echo "SING_BOX=$bin/sing-box"
            echo "SING_BOX_BIN=$bin/sing-box"
            echo "SBR_SINGBOX_BIN=$bin/sing-box"
            echo "SBR_SINGBOX_UTLS_BIN=$bin/sing-box"
            echo "SBR_XRAY=$bin/xray"
            echo "SBR_HYSTERIA=$bin/hysteria"
          } >> "$GITHUB_ENV"
          "$bin/sing-box" version | head -1
          "$bin/xray" version | head -1
          "$bin/hysteria" version | grep -i '^version' || true
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - if: ${{ !cancelled() && steps.cache.outcome == 'success' }}
        run: cargo test --workspace --no-fail-fast

  # The xcframework for every Apple platform the app ships on, then the app
  # against it, unsigned. Main keeps the xcframework for TestFlight, so CD
  # ships what CI built.
  apple:
    name: Apple
    runs-on: macos-latest
    timeout-minutes: 120
    env:
      # The app has no Catalyst target; the slices build for nothing.
      SBR_SKIP_CATALYST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # tvOS is tier 3: nightly builds its std from source. Stable last, so it
      # is the default toolchain the script's other builds use.
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # stable
        with:
          toolchain: stable
          targets: aarch64-apple-ios,aarch64-apple-ios-sim,x86_64-apple-ios,aarch64-apple-darwin,x86_64-apple-darwin
      # Seven release builds with fat LTO: the slowest part of the run.
      # Saved even when the app fails to build, since the Rust built fine.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
          shared-key: apple
          cache-on-failure: true
      - uses: jdx/mise-action@9149ea85001c7435d5a66bb127d6a1b6227cb0a5 # v5.0.0
        with:
          install_args: xcodegen
      - run: apple/build-xcframework.sh
      - run: mise exec -- xcodegen generate
        working-directory: apple/App
      - name: Build the app
        working-directory: apple/App
        run: |
          for spec in Sbr:iOS Sbr:tvOS Sbr:macOS SbrMac:macOS; do
            scheme=${spec%%:*} platform=${spec##*:}
            echo "::group::$scheme ($platform)"
            log="$RUNNER_TEMP/build-$scheme-$platform.log"
            if xcodebuild build -project Sbr.xcodeproj -scheme "$scheme" \
              -destination "generic/platform=$platform" \
              -derivedDataPath "$RUNNER_TEMP/dd" CODE_SIGNING_ALLOWED=NO > "$log" 2>&1; then
              tail -n 3 "$log"
              echo "::endgroup::"
            else
              echo "::endgroup::"
              grep -E 'error:' "$log" || tail -n 60 "$log"
              echo "::error::$scheme failed to build for $platform"
              exit 1
            fi
          done
      # Tarred: an artifact keeps neither symlinks nor modes.
      # A release pull request's too, for the macOS signing check.
      - if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-v')
        run: tar czf "$RUNNER_TEMP/SbrCore.xcframework.tar.gz" -C apple SbrCore.xcframework
      - if: github.event_name != 'pull_request' || startsWith(github.head_ref, 'release-v')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SbrCore.xcframework
          path: ${{ runner.temp }}/SbrCore.xcframework.tar.gz
          retention-days: 1

  # A release pull request signs, exports and packages the Developer ID app
  # without notarising it, so a broken profile or entitlement fails the pull
  # request rather than the release.
  macos-signing:
    name: macOS signing
    needs: apple
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'release-v')
    uses: ./.github/workflows/macos.yml
    with:
      notarise: false
    secrets: inherit

  # CHANGELOG.md is generated from changelog.d/ (scripts/changelog.py). A pull
  # request adds fragments without regenerating it, so only its fragments and
  # the released versions are checked; a release pull request, the one that
  # writes CHANGELOG.md, must write exactly what the fragments make.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: python3 -m unittest scripts/test_changelog.py
      - env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [[ "$HEAD_REF" == release-v* ]]; then
            python3 scripts/changelog.py --check
          else
            python3 scripts/changelog.py --lint
          fi

  # Always runs: the workflows are checked wherever the change is, and the
  # image bundles shellcheck for the `run:` scripts.
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color

  # The one status a ruleset needs to require.
  checks:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [actionlint, fmt, linux, macos, apple, macos-signing, changelog]
    if: always()
    steps:
      - env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          if [ -n "$bad" ]; then
            echo "::error::not passed: $(echo "$bad" | tr '\n' ' ')"
            exit 1
          fi

  # ── CD ──────────────────────────────────────────────────────────────────

  # Every push to main that passes uploads an iOS build: the version stays and
  # the build number (the time) rises, so testers always have main. A failed
  # upload is retried alone from ios.yml's manual dispatch.
  testflight:
    name: TestFlight
    needs: checks
    if: ${{ !cancelled() && needs.checks.result == 'success' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/ios.yml
    secrets: inherit

  # Whether this run releases, the one answer the release jobs read: a push
  # that changes the workspace version, or a manual run asked to release (how
  # a failed release is retried), when that version has no GitHub release yet.
  # A manual run releases main's head, which the tag then points at.
  version:
    name: Version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          ASKED: ${{ inputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          version_of() { sed -n 's/^version = "\(.*\)"/\1/p' | head -1; }
          version=$(version_of < Cargo.toml)
          release=false
          if { [ "$EVENT" = workflow_dispatch ] && [ "$ASKED" = true ]; } \
            || { [ "$EVENT" = push ] && [ "$(git show HEAD^1:Cargo.toml 2>/dev/null | version_of)" != "$version" ]; }; then
            # Only a 404 means the version is not out. Any other failure stops
            # the run: guessing either way releases twice or never.
            if ! out=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$version" 2>&1); then
              if printf '%s' "$out" | grep -q 'HTTP 404'; then
                release=true
              else
                echo "::error::cannot tell whether v$version is released: $out"
                exit 1
              fi
            fi
          fi
          marketing=$(sed -n 's/^ *MARKETING_VERSION: "\(.*\)"/\1/p' apple/App/project.yml | head -1)
          # Checked here, so a release that would fail late fails before any
          # macOS runner starts.
          if [ "$release" = true ]; then
            if [ "$marketing" != "$version" ]; then
              echo "::error::apple/App/project.yml's MARKETING_VERSION ($marketing) differs from Cargo.toml's version ($version)"
              exit 1
            fi
            if ! grep -qxF "## $version" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no section for $version: release with mise run release"
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "v$version: release=$release"

  macos-release:
    name: macOS release
    needs: [checks, version]
    if: ${{ !cancelled() && needs.checks.result == 'success' && needs.version.outputs.release == 'true' }}
    uses: ./.github/workflows/macos.yml
    with:
      notarise: true
    secrets: inherit

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, macos-release]
    if: ${{ !cancelled() && needs.version.outputs.release == 'true' && needs.macos-release.result == 'success' }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbr-macos
          path: artifacts
      # Release writes go through RELEASE_TOKEN: GitHub refuses the workflow
      # token's tag creation for a commit that changes a workflow ("refusing to
      # allow a GitHub App to create or update workflow"), contents: write
      # notwithstanding, and sbr's workflow token is read-only.
      - name: Check the release token
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo "::error::RELEASE_TOKEN is not set; the release cannot be published"
            exit 1
          fi
      - name: Write the release notes
        run: |
          section=$(awk -v h="## $VERSION" '$0==h{f=1;next} f&&/^## /{exit} f' CHANGELOG.md)
          cat > "$RUNNER_TEMP/notes.md" <<NOTES
          ## Install

          Open sbr-$VERSION.dmg and drag sbr to Applications. On first connect,
          allow its network extension under System Settings › General › Login
          Items & Extensions. macOS 15 or later.
          $section
          NOTES
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        # The action creates the tag through the API, on the commit that was
        # built. A re-run finds the release and tag and fills in what is
        # missing, such as an asset whose upload failed.
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: v${{ needs.version.outputs.version }}
          body_path: ${{ runner.temp }}/notes.md
          draft: false
          files: artifacts/sbr-${{ needs.version.outputs.version }}.dmg
          fail_on_unmatched_files: true
