# XcodeGen spec: `xcodegen generate` (see README.md).
#
# Targets
#   Sbr                        iOS 17+, macOS 14+, tvOS 17+ app (SwiftUI)
#   SbrTunnel                  its packet tunnel, as an app extension
#                              (iOS, tvOS, and Mac App Store style on macOS)
#   SbrMac                     macOS Developer ID flavour of the same app ...
#   SbrTunnelSystemExtension   ... shipping the tunnel as a system extension
#   SbrWidgets                 iOS 18+ Control Center toggle, embedded in Sbr
name: Sbr

options:
  createIntermediateGroups: true

settings:
  base:
    DEVELOPMENT_TEAM: 2256Q92VF2
    # Everything else derives from this.
    SBR_BUNDLE_ID: cc.blit.sbr
    # App Groups: "group." IDs on iOS/tvOS, team-prefixed on macOS (which also
    # lets the system extension's Mach service name live under it).
    SBR_APP_GROUP: group.$(SBR_BUNDLE_ID)
    "SBR_APP_GROUP[sdk=macosx*]": $(DEVELOPMENT_TEAM).$(SBR_BUNDLE_ID)
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEAD_CODE_STRIPPING: YES
    CODE_SIGN_STYLE: Automatic

packages:
  SbrKit:
    path: ..

targets:
  Sbr:
    type: application
    platform: auto
    supportedDestinations: [iOS, macOS, tvOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
      tvOS: "17.0"
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - package: SbrKit
      - target: SbrTunnel
        embed: true
      - target: SbrWidgets
        embed: true
        destinationFilters: [iOS]
    info:
      path: Support/App-Info.plist
      properties:
        CFBundleDisplayName: sbr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen:
          UIColorName: LaunchBackground
        # As declared in App Store Connect for the first build: standard,
        # exempt encryption only. Skips the per-build compliance question.
        ITSAppUsesNonExemptEncryption: false
        # iPad multitasking requires all four; App Store validation rejects none.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # sing-box remote-profile links, and the same under sbr://.
        CFBundleURLTypes:
          - CFBundleURLName: cc.blit.sbr.profile
            CFBundleURLSchemes: [sing-box, sbr]
        NSCameraUsageDescription: sbr uses the camera only to read a profile's QR code.
        SbrTunnelBundleIdentifier: $(SBR_BUNDLE_ID).tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SBR_BUNDLE_ID)
        PRODUCT_NAME: sbr
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
        OTHER_LDFLAGS: $(inherited) -lresolv
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_APPICON_NAME[sdk=appletv*]": "App Icon & Top Shelf Image"
        CODE_SIGN_ENTITLEMENTS: App/App.entitlements
        # Adds Access WiFi Information, for trusting the current network.
        "CODE_SIGN_ENTITLEMENTS[sdk=iphone*]": App/App-iOS.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": App/App-macOS.entitlements
      configs:
        # App Store builds sign with the API-provisioned distribution profile.
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": sbr App Store
          "CODE_SIGN_STYLE[sdk=appletvos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": sbr tvOS App Store

  SbrTunnel:
    type: app-extension
    platform: auto
    supportedDestinations: [iOS, macOS, tvOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
      tvOS: "17.0"
    sources:
      - path: Tunnel
        excludes: ["*.entitlements"]
    dependencies:
      - package: SbrKit
    info:
      path: Support/Tunnel-Info.plist
      properties:
        CFBundleDisplayName: SbrTunnel
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SBR_BUNDLE_ID).tunnel
        CODE_SIGN_ENTITLEMENTS: Tunnel/Tunnel.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=macosx*]": Tunnel/Tunnel-macOS.entitlements
      configs:
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": sbr tunnel App Store
          "CODE_SIGN_STYLE[sdk=appletvos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=appletvos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=appletvos*]": sbr tunnel tvOS App Store

  SbrWidgets:
    type: app-extension
    platform: iOS
    # Controls are new in iOS 18; iOS 17 leaves the extension unloaded.
    deploymentTarget: "18.0"
    sources:
      - path: Widgets
        excludes: ["*.entitlements"]
      - path: Shared
    info:
      path: Support/Widgets-Info.plist
      properties:
        CFBundleDisplayName: sbr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        SbrTunnelBundleIdentifier: $(SBR_BUNDLE_ID).tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SBR_BUNDLE_ID).widgets
        CODE_SIGN_ENTITLEMENTS: Widgets/Widgets.entitlements
      configs:
        Release:
          "CODE_SIGN_STYLE[sdk=iphoneos*]": Manual
          "CODE_SIGN_IDENTITY[sdk=iphoneos*]": Apple Distribution
          "PROVISIONING_PROFILE_SPECIFIER[sdk=iphoneos*]": sbr widgets App Store

  SbrMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: App
        excludes: ["*.entitlements"]
      - path: Shared
    dependencies:
      - package: SbrKit
      - target: SbrTunnelSystemExtension
        embed: true
    info:
      path: Support/AppMac-Info.plist
      properties:
        CFBundleDisplayName: sbr
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        SbrAppGroup: $(SBR_APP_GROUP)
        SbrTunnelBundleIdentifier: $(SBR_BUNDLE_ID).mac.tunnel
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SBR_BUNDLE_ID).mac
        CODE_SIGN_ENTITLEMENTS: App/App-macOS-SystemExtension.entitlements
        SWIFT_OBJC_BRIDGING_HEADER: App/Bridging.h
        OTHER_LDFLAGS: $(inherited) -lresolv
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) SBR_SYSTEM_EXTENSION
        ENABLE_HARDENED_RUNTIME: YES

  SbrTunnelSystemExtension:
    type: system-extension
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - Tunnel/PacketTunnelProvider.swift
      - SystemExtension/main.swift
    dependencies:
      - package: SbrKit
    info:
      path: Support/SystemExtension-Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NetworkExtension:
          NEMachServiceName: $(SBR_APP_GROUP).tunnel
          NEProviderClasses:
            com.apple.networkextension.packet-tunnel: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(SBR_BUNDLE_ID).mac.tunnel
        CODE_SIGN_ENTITLEMENTS: SystemExtension/SystemExtension.entitlements
        ENABLE_HARDENED_RUNTIME: YES
