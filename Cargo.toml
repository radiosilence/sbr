[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
sbr-config = { path = "crates/sbr-config" }
sbr-core = { path = "crates/sbr-core" }
sbr-dns = { path = "crates/sbr-dns" }
sbr-engine = { path = "crates/sbr-engine" }

anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "rt-multi-thread", "net", "io-util", "time", "macros", "sync", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
regex = "1.13"
aho-corasick = "1.1"
ipnet = "2"
base64 = "0.22"
bytes = "1"
flate2 = "1"
arc-swap = "1"
futures-util = { version = "0.3", default-features = false, features = ["std"] }

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3

[profile.bench]
inherits = "release"

# Parallel worktrees share one disk: keep dev artifacts small.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
