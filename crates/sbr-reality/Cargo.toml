[package]
name = "sbr-reality"
description = "TLS 1.3 client with browser ClientHello fingerprints: REALITY and ordinary TLS"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aws-lc-rs = "1.18"
base64.workspace = true
tokio = { workspace = true }
# Certificate verification (the `ServerCertVerifier` trait) and its types.
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std"] }
# RFC 8879 certificate decompression: Chrome offers brotli, Apple zlib, Firefox all three.
brotli-decompressor = "5"
flate2.workspace = true
ruzstd = "0.8"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs"] }
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
md-5 = "0.10"
brotli = "8"
h2 = "0.4"
http = "1"
httparse = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }
