[package]
name = "sbr-tun"
description = "TUN devices, the system-stack NAT and a userspace TCP stack for sbr"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
libc = "0.2"
tokio = { workspace = true }
tracing.workspace = true
ipnet.workspace = true
rustc-hash = "2"
bytes.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
# An independent TCP implementation to test against.
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp"] }
