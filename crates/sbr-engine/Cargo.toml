[package]
name = "sbr-engine"
description = "Protocol implementations and the sbr runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbr-config.workspace = true
sbr-core.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true
httparse = "1.10"
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "aead-cipher-extra"] }

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
