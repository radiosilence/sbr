[package]
name = "sbr-engine"
description = "Protocol implementations and the sbr runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbr-config.workspace = true
sbr-core.workspace = true
sbr-dns.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true
httparse = "1.10"
sbr-tun = { path = "../sbr-tun" }
sbr-reality = { path = "../sbr-reality" }
ipnet.workspace = true
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "aead-cipher-extra"] }
quinn = { version = "0.11.12", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
quinn-proto = { version = "0.11.19", default-features = false }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "logging", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12", "logging"] }
webpki-roots = "1"
aws-lc-rs = "1.13"
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
http = "1"
blake2 = "0.10"
rustls-pki-types = { version = "1", features = ["std"] }
fastrand = "2"
socket2 = "0.6"
sha3 = "0.11"
crc32fast = "1"
aes = "0.9"
libc = "0.2"
russh = { version = "0.65", default-features = false, features = ["aws-lc-rs", "rsa", "flate2"] }
# Clash API, rule-set downloads, urltest probes, cache file.
serde.workspace = true
serde_json.workspace = true
flate2.workspace = true
futures-util.workspace = true
hyper = { version = "1", features = ["client", "server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http-body-util = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio", "ws"] }
redb = "4"
tracing-subscriber.workspace = true

# ShadowTLS, AnyTLS, WireGuard.
quinn-udp = { version = "0.6", default-features = false }
x25519-dalek = { version = "2", features = ["static_secrets"] }
md-5 = "0.10"
boringtun = { version = "0.7", default-features = false }
smoltcp = { version = "0.14", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "proto-ipv4-fragmentation", "socket-udp", "async"] }

[target.'cfg(target_vendor = "apple")'.dependencies]
libc = "0.2"

[dev-dependencies]
hickory-proto = { version = "0.26", default-features = false, features = ["std"] }
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
tokio = { workspace = true, features = ["full", "test-util"] }
tokio-tungstenite = "0.28"
