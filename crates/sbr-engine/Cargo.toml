[package]
name = "sbr-engine"
description = "Protocol implementations and the sbr runtime"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
sbr-config.workspace = true
sbr-core.workspace = true
tokio.workspace = true
tracing.workspace = true
thiserror.workspace = true
base64.workspace = true
bytes.workspace = true
httparse = "1.10"
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022", "aead-cipher-extra"] }
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12", "prefer-post-quantum"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
webpki-roots = "1"
aws-lc-rs = "1.13"
h2 = "0.4"
http = "1"
md-5 = "0.11"
sha3 = "0.11"
crc32fast = "1"
aes = "0.9"
libc = "0.2"

[dev-dependencies]
tokio = { workspace = true, features = ["full"] }
serde_json.workspace = true
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
