[package]
name = "sbr-gui"
description = "The sbr app for macOS and iOS, in GPUI with kōan's koan-kit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# A static library for the Xcode app targets (SbrGui.xcframework), whose
# `main` calls `sbr_gui_main`; the binary is for development runs.
[lib]
crate-type = ["rlib", "staticlib"]

[features]
# GPUI's Metal shaders compiled at launch rather than at build time, so a
# development build needs only the Command Line Tools. Releases leave it off.
runtime-shaders = ["koan-kit/runtime-shaders"]

[dependencies]
sbr-message = { path = "../sbr-message" }
serde.workspace = true
serde_json.workspace = true
percent-encoding = "2.3"
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

# GPUI and koan-kit exist only for Apple targets here; elsewhere the crate is
# an empty binary, so the Linux jobs build no display stack.
[target.'cfg(target_vendor = "apple")'.dependencies]
# koan-kit and GPUI pinned together: koan-kit's revision of koan, and the
# radiosilence/zed revision that koan's workspace pins, so Cargo builds a
# single GPUI. Bump them together.
koan-kit = { git = "https://github.com/radiosilence/koan", rev = "7c87324b82090d4863165bcfef07832caa04c640" }
gpui = { package = "gpui-koan", git = "https://github.com/radiosilence/zed", rev = "be8db535bac465333448ec87099ba5faa7fd37aa" }
gpui_platform = { package = "gpui-koan-platform", git = "https://github.com/radiosilence/zed", rev = "be8db535bac465333448ec87099ba5faa7fd37aa", features = ["font-kit"] }
futures = "0.3"
block2 = "0.6"
objc2 = "0.6"
objc2-foundation = { version = "0.3.2", features = [
  "NSArray",
  "NSBundle",
  "NSData",
  "NSDictionary",
  "NSError",
  "NSNotification",
  "NSOperation",
  "NSPathUtilities",
  "NSURL",
  "NSString",
  "NSUserDefaults",
  "NSValue",
  "block2",
] }
objc2-network-extension = "0.3.2"
# The throughput graph's samples, handed to the GPU as a texture.
image = { version = "0.25.1", default-features = false }
objc2-core-foundation = { version = "0.3.2", features = ["CFString", "CFDictionary"] }
objc2-security = { version = "0.3.2", default-features = false, features = ["std", "SecBase", "SecItem"] }
sbr-apple = { path = "../sbr-apple" }

# The menu bar item, the Dock, and launch at login.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-app-kit = { version = "0.3.2", features = [
  "NSApplication",
  "NSButton",
  "NSCell",
  "NSControl",
  "NSEvent",
  "NSImage",
  "NSMenu",
  "NSMenuItem",
  "NSResponder",
  "NSRunningApplication",
  "NSStatusBar",
  "NSStatusBarButton",
  "NSStatusItem",
  "NSView",
  "NSWorkspace",
] }
objc2-service-management = { version = "0.3.2", features = ["SMAppService"] }
objc2-system-extensions = "0.3.2"
dispatch2 = "0.3"

[target.'cfg(target_vendor = "apple")'.dev-dependencies]
gpui = { package = "gpui-koan", git = "https://github.com/radiosilence/zed", rev = "be8db535bac465333448ec87099ba5faa7fd37aa", features = ["test-support"] }
gpui_platform = { package = "gpui-koan-platform", git = "https://github.com/radiosilence/zed", rev = "be8db535bac465333448ec87099ba5faa7fd37aa", features = ["font-kit", "test-support"] }
image = { version = "0.25.1", default-features = false, features = ["png"] }
